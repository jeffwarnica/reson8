<!DOCTYPE html>
<html>

<head>
    <title>Reson8 | Audio Signal Flow</title>
    <style>
        :root {
            --primary: #0056b3;
            --k8s: #326ce5;
            --accent: #ff5722;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: #eceff1;
            color: #333;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        /* Flow Layout */
        .signal-chain {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .channel-strip {
            background: #f8f9fa;
            border-left: 5px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .channel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .channel-name {
            font-weight: bold;
            font-size: 1.1em;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0;
        }

        .slider-row label {
            width: 100px;
            font-size: 0.85em;
            color: #666;
            font-weight: bold;
        }

        .slider-row input[type=range] {
            flex-grow: 1;
        }

        .slider-row span {
            min-width: 35px;
            font-family: monospace;
            font-size: 0.9em;
            background: #eee;
            padding: 2px 5px;
            border-radius: 3px;
        }

        /* Status Colors */
        .intensity-bar-container {
            height: 8px;
            background: #ddd;
            border-radius: 4px;
            overflow: hidden;
            margin: 5px 0;
        }

        .intensity-bar-fill {
            height: 100%;
            background: var(--k8s);
            width: 0%;
            transition: width 0.3s;
        }

        .k8s-toggle {
            background: #e3f2fd;
            border: 1px solid var(--k8s);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        #debugLog {
            width: 100%;
            height: 180px;
            background: #263238;
            color: #81c784;
            font-family: 'Consolas', monospace;
            padding: 10px;
            border: none;
            border-radius: 4px;
            margin-top: 10px;
        }

        button {
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-play {
            background: var(--primary);
            color: white;
        }

        .btn-drop {
            background: #673ab7;
            color: white;
            font-size: 0.8em;
        }

        .btn-stop {
            background: #d32f2f;
            color: white;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Global Control</h2>
        <div style="display: flex; gap: 20px; align-items: center;">
            <div class="k8s-toggle">
                <strong>K8s Signal Sync:</strong>
                <input type="checkbox" id="k8sActive" checked>
                <span id="k8sStatusText" style="color:var(--k8s)">ACTIVE</span>
            </div>
            <div>
                <button id="startBtn" class="btn-play">▶ Start Stream</button>
                <button id="stopBtn" class="btn-stop" disabled>■ Stop</button>
            </div>
            <audio id="audioPlayer"></audio>
            <div id="connectionStatus" class="status">Status: Disconnected</div>
        </div>

        <div class="slider-row" style="background: #fff3e0; padding: 10px; border-radius: 8px;">
            <label>OUTPUT (Server)</label>
            <input type="range" id="serverMasterVol" min="0" max="100" step="0.01">
            <span id="serverMasterVolVal">0.00</span>
            <small>Global for all users</small>
        </div>

        <div class="slider-row" style="background: #f1f8e9; padding: 10px; border-radius: 8px;">
            <label>LOCAL (Browser)</label>
            <input type="range" id="localVol" min="0" max="100" step="0.01" value="0.2">
            <span id="localVolVal">0.20</span>
        </div>
    </div>

    <div class="signal-chain">
        <div id="channelsContainer">
            <div class="card">
                <h2>Mixer Channels</h2>
                <div id="chList"></div>
            </div>
        </div>

        <div>
            <!--
                <div class="card">
                    <h2>Sound Drops</h2>
                    <div id="dropsList"></div>
                </div>
            -->

            <div class="card">
                <h2>Pipeline Log</h2>
                <button onclick="fetchMixerDump()" style="font-size: 10px;">Refresh Dump</button>
                <textarea id="debugLog" readonly></textarea>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const k8sCheck = document.getElementById('k8sActive');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('connectionStatus');
        let activeSliders = new Set(); // Tracks sliders the user is currently touching

        // --- STREAM LOGIC ---

            startBtn.onclick = () => {
            status.innerText = "Status: Connecting...";
            audio.src = '';
            audio.load();
            audio.src = '/audio/stream?t=' + Date.now();
            audio.play().then(() => {
                isStreaming = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                status.innerText = "Status: Streaming Live Assets...";
                status.style.color = "green";
            }).catch(e => {
                console.error("Error:", e);
                status.innerText = "Status: Error";
                status.style.color = "red";
            });
        };

        stopBtn.onclick = () => {
            isStreaming = false;
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
            startBtn.disabled = false;
            stopBtn.disabled = true;
            status.innerText = "Status: Disconnected";
            status.style.color = "#666";
        };

        // --- CORE SYNC LOGIC ---

        async function syncState() {
            try {
                const res = await fetch('/audio/control/state');
                const state = await res.json();

                
                // We only update it if the user isn't clicking it (standard safety)
                k8sCheck.checked = state.k8sSyncActive;
                document.getElementById('k8sStatusText').innerText = state.k8sSyncActive ? "ACTIVE" : "PAUSED";
                document.getElementById('k8sStatusText').style.color = state.k8sSyncActive ? "var(--k8s)" : "var(--accent)"

                // 1. Update Global Master
                if (!activeSliders.has('serverMasterVol')) {
                    document.getElementById('serverMasterVol').value = state.masterVolume;
                    document.getElementById('serverMasterVolVal').innerText = state.masterVolume.toFixed(2);
                }

                // 2. Update Channels
                state.channels.forEach(ch => {
                    updateChannelUI(ch);
                });
            } catch (e) { console.error("Sync failed", e); }
        }

        function updateChannelUI(ch) {
            const row = document.getElementById(`ch-${ch.name}`);
            if (!row) return;
            
            // Update Intensity Bar (Visual only)
            const bar = row.querySelector('.intensity-bar-fill');
            if (bar) bar.style.width = (ch.intensity * 100) + '%';
            row.querySelector('.intensity-val').innerText = Math.round(ch.intensity * 100) + '%';

            // Update Faders if not being touched
            const chFader = row.querySelector('.ch-fader');
            if (!activeSliders.has(chFader.id)) {
                chFader.value = ch.chanVol;
                row.querySelector('.chFader-val').innerText = ch.chanVol.toFixed(2);
            }
            const mixFader = row.querySelector('.mix-fader');
            if (!activeSliders.has(mixFader.id)) {
                mixFader.value = ch.mixerVol;
                row.querySelector('.mixFader-val').innerText = ch.mixerVol.toFixed(2);
            }
        }

        // --- INTERACTION ---

        async function postControl(path, body) {
            await fetch(path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
        }

        // Global K8s Toggle
        k8sCheck.onchange = async () => {
            const active = k8sCheck.checked;
            document.getElementById('k8sStatusText').innerText = active ? "ACTIVE" : "PAUSED";
            await fetch(`/audio/control/k8s-sync/${active}`, { method: 'POST' });
        };

        // Local Browser Volume
        document.getElementById('localVol').oninput = (e) => {
            audio.volume = e.target.value;
            document.getElementById('localVolVal').innerText = parseFloat(e.target.value).toFixed(2);
        };

        // --- INITIALIZATION ---

        async function init() {
            const res = await fetch('/audio/control/channels');
            const channels = await res.json();
            const list = document.getElementById('chList');
            
            channels.forEach(ch => {
                const div = document.createElement('div');
                div.id = `ch-${ch.name}`;
                div.className = 'channel-strip';

                // Determine header content based on channel type
                const headerAction = ch.isDrop
                    ? `<button class="btn-drop" onclick="playDrop('${ch.name}')">▶ TRIGGER DROP</button>`
                    : `<span class="status-tag">CONTINUOUS</span>`;

                div.innerHTML = `
                <div class="channel-header">
                    <span class="channel-name">${ch.name.toUpperCase()}</span>
                    ${headerAction}
                </div>
                
                <div class="intensity-bar-container">
                    <div class="intensity-bar-fill"></div>
                </div>
                
                <div class="slider-row">
                    <label>SIGNAL INTENSITY</label>
                    <input type="range" class="intensity-slider" id="int-${ch.name}" 
                        min="0" max="100" step="0.01" value="${ch.intensity}">
                    <span class="intensity-val">0%</span>
                </div>

                <div class="slider-row">
                    <label>CHAN OUTPUT VOL</label>
                    <input type="range" class="fader-slider ch-fader" id="chanFade-${ch.name}" 
                        min="0" max="100" step="0.01" value="${ch.chanVol}">
                    <span class="chFader-val">${ch.chanVol}</span>
                </div>

                <div class="slider-row">
                    <label>MIXER FADER</label>
                    <input type="range" class="fader-slider mix-fader" id="mixerFade-${ch.name}" 
                        min="0" max="100" step="0.01" value="${ch.mixerVol}">
                    <span class="mixFader-val">${ch.mixerVol}</span>
                </div>
                `;
                list.appendChild(div);

                // Event Listeners for Sliders
                const chfader = div.querySelector('.ch-fader');
                chfader.onmousedown = () => activeSliders.add(chfader.id);
                chfader.onmouseup = () => activeSliders.delete(chfader.id);
                chfader.oninput = (e) => postControl('/audio/control/fader', { channel: ch.name, mixVol: parseFloat(div.querySelector('.mix-fader').value), chVol: parseFloat(e.target.value) });

                const mixfader = div.querySelector('.mix-fader');
                mixfader.onmousedown = () => activeSliders.add(mixfader.id);
                mixfader.onmouseup = () => activeSliders.delete(mixfader.id);
                mixfader.oninput = (e) => postControl('/audio/control/fader', { channel: ch.name, mixVol: parseFloat(e.target.value), chVol: parseFloat(div.querySelector('.ch-fader').value )});

                const intensity = div.querySelector('.intensity-slider');
                intensity.oninput = (e) => fetch(`/audio/control/channels/${ch.name}/intensity/${e.target.value}`, { method: 'PATCH' });
            });

            // Start Polling every 500ms
            setInterval(syncState, 500);
        }

        async function playDrop(name) {
            await postControl('/audio/drop', { drop: name });
        }

        // Standard stream start/stop logic remains same...
        init();
    </script>
</body>

</html>
