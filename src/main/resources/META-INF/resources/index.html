<!DOCTYPE html>
<html>

<head>
    <title>Reson8 | Audio Signal Flow</title>
    <style>
        :root {
            --primary: #0056b3;
            --k8s: #326ce5;
            --prometheus: #e65100;
            --accent: #ff5722;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: #eceff1;
            color: #333;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .channel-strip {
            background: #f8f9fa;
            border-left: 8px solid var(--primary);
            /* Default color */
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* Channel Type Styles */
        .type-k8s {
            border-left-color: var(--k8s);
        }

        .type-prometheus {
            border-left-color: var(--prometheus);
        }

        .type-drop {
            border-left-color: #673ab7;
        }

        .tag {
            font-size: 0.7em;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            vertical-align: middle;
        }

        .tag-k8s {
            background: var(--k8s);
        }

        .tag-prom {
            background: var(--prometheus);
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0;
        }

        .slider-row label {
            width: 130px;
            font-size: 0.85em;
            color: #666;
            font-weight: bold;
        }

        .intensity-input {
            width: 80px;
            padding: 4px;
            font-family: monospace;
        }

        .intensity-bar-container {
            height: 8px;
            background: #ddd;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .intensity-bar-fill {
            height: 100%;
            background: var(--k8s);
            width: 0%;
            transition: width 0.3s;
        }

        #debugLog {
            width: 100%;
            height: 180px;
            background: #263238;
            color: #81c784;
            font-family: 'Consolas', monospace;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Global Control</h2>
        <div style="display: flex; gap: 20px; align-items: center;">
            <div class="k8s-toggle">
                <strong>K8s Signal Sync:</strong>
                <input type="checkbox" id="k8sActive" checked>
                <span id="k8sStatusText">ACTIVE</span>
            </div>
            <div>
                <button id="startBtn" style="background:var(--primary); color:white;">▶ Start Stream</button>
                <button id="stopBtn" style="background:#d32f2f; color:white;" disabled>■ Stop</button>
            </div>
        </div>

        <div class="slider-row" style="background: #f1f8e9; padding: 10px; border-radius: 8px; margin-top: 15px;">
            <label>LOCAL (Browser)</label>
            <input type="range" id="localVol" min="0" max="1" step="0.01" value="0.5">
            <span id="localVolVal">0.50</span>
        </div>
    </div>

    <div class="signal-chain" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="card">
            <h2>Mixer Channels</h2>
            <div id="chList"></div>
        </div>

        <div class="card">
            <h2>Pipeline Log</h2>
            <textarea id="debugLog" readonly></textarea>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const activeSliders = new Set();

        // Fix Local Volume immediately on interaction
        document.getElementById('localVol').oninput = (e) => {
            const val = parseFloat(e.target.value);
            audio.volume = val;
            document.getElementById('localVolVal').innerText = val.toFixed(2);
        };

        async function init() {
            const res = await fetch('/audio/control/channels');
            const channels = await res.json();
            const list = document.getElementById('chList');

            channels.forEach(ch => {
                const div = document.createElement('div');
                div.id = `ch-${ch.name}`;

                // Set class based on SourceType
                const typeClass = ch.sourceType === 'PROMETHEUS' ? 'type-prometheus' : 'type-k8s';
                div.className = `channel-strip ${typeClass}`;

                const isProm = ch.sourceType === 'PROMETHEUS';
                const tag = isProm ? '<span class="tag tag-prom">THANOS</span>' : '<span class="tag tag-k8s">K8S</span>';

                // Use an Input box for Thanos (unbounded scale), Slider for K8s (0-1.0)
                const intensityControl = isProm
                    ? `<input type="number" class="intensity-input" id="int-${ch.name}" value="${ch.intensity}" step="0.1">`
                    : `<input type="range" class="intensity-slider" id="int-${ch.name}" min="0" max="1" step="0.01" value="${ch.intensity}">`;

                div.innerHTML = `
                <div class="channel-header" style="display:flex; justify-content:space-between;">
                    <span class="channel-name">${tag} ${ch.name.toUpperCase()}</span>
                </div>
                
                <div class="intensity-bar-container">
                    <div class="intensity-bar-fill"></div>
                </div>
                
                <div class="slider-row">
                    <label>SIGNAL INTENSITY</label>
                    ${intensityControl}
                    <span class="intensity-val">0%</span>
                </div>

                <div class="slider-row">
                    <label>MIXER FADER</label>
                    <input type="range" class="mix-fader" id="mixerFade-${ch.name}" min="0" max="1" step="0.01" value="${ch.mixerVol || 0}">
                    <span class="mixFader-val">${(ch.mixerVol || 0).toFixed(2)}</span>
                </div>
                `;
                list.appendChild(div);

                // Handle Input/Slider events
                const intCtrl = div.querySelector(isProm ? '.intensity-input' : '.intensity-slider');
                intCtrl.oninput = (e) => {
                    const val = parseFloat(e.target.value);
                    fetch(`/audio/control/channels/${ch.name}/intensity/${val}`, { method: 'PATCH' });
                };

                const mixfader = div.querySelector('.mix-fader');
                mixfader.onmousedown = () => activeSliders.add(mixfader.id);
                mixfader.onmouseup = () => activeSliders.delete(mixfader.id);
                mixfader.oninput = (e) => {
                    const val = parseFloat(e.target.value);
                    fetch('/audio/control/fader', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ channel: ch.name, mixVol: val })
                    });
                };
            });

            setInterval(syncState, 500);
        }

        async function syncState() {
            try {
                const res = await fetch('/audio/control/state');
                const state = await res.json();

                state.channels.forEach(ch => {
                    const row = document.getElementById(`ch-${ch.name}`);
                    if (!row) return;

                    // Update the visual progress bar (clamped 0-100 for display)
                    const barFill = ch.intensity > 1 ? 1 : (ch.intensity < 0 ? 0 : ch.intensity);
                    row.querySelector('.intensity-bar-fill').style.width = (barFill * 100) + '%';
                    row.querySelector('.intensity-val').innerText = (ch.intensity).toFixed(3);

                    // Update Faders only if not being touched
                    const fader = row.querySelector('.mix-fader');
                    if (!activeSliders.has(fader.id)) {
                        const vol = ch.mixerVol || 0; // Fallback to 0 if undefined
                        fader.value = vol;
                        row.querySelector('.mixFader-val').innerText = vol.toFixed(2);
                    }
                });
            } catch (e) { }
        }

        init();
    </script>
</body>

</html>
