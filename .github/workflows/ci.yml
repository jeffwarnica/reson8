name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners only offer ubuntu/windows/macos VMs. All job steps run
# inside Fedora containers (dnf packages) — never Ubuntu/apt as the build env.
jobs:
  maven-test:
    name: Maven test
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 21 and GStreamer
        run: |
          set -euo pipefail
          dnf -y install \
            java-21-openjdk-devel \
            gstreamer1 \
            gstreamer1-plugins-base \
            gstreamer1-plugins-good \
            gstreamer1-plugins-bad-free \
            tar \
            gzip \
            which \
            findutils \
            git
          java -version
          gst-inspect-1.0 audiocheblimit >/dev/null

      - name: Run tests
        run: ./mvnw -B -pl reson8,disson8 -am test

  helm-check:
    name: Helm lint and template
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        run: |
          set -euo pipefail
          dnf -y install curl ca-certificates tar gzip which git
          HELM_VERSION=v3.16.4
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Lint, template, sanity
        run: ./deploy/ci-helm-check.sh
