---
# Cluster-scoped access baseline for the default included soundscape/signal-map.
# The baseline is primarily about reading metrics/signals across namespaces,
# including source namespaces other than the app's own namespace.
# This checked-in binding targets the shared prod-style runtime lane:
#   system:serviceaccount:reson8:reson8
# For per-user cluster-test namespaces (${BASE_NS}-dev-${USER}), use an equivalent
# binding whose subject namespace matches that test namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reson8-cluster-observer
rules:
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["list", "watch"]
- apiGroups: [""]
  resources: ["nodes", "pods"]
  verbs: ["list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["list", "watch"]
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reson8-cluster-observer
subjects:
- kind: ServiceAccount
  name: reson8
  namespace: reson8
roleRef:
  kind: ClusterRole
  name: reson8-cluster-observer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reson8-monitoring-view
subjects:
- kind: ServiceAccount
  name: reson8
  namespace: reson8
roleRef:
  kind: ClusterRole
  name: cluster-monitoring-view
  apiGroup: rbac.authorization.k8s.io
