# ------------------------------------------------------------------------------
# Example overlay for mounted ConfigMap application.yaml (production-like cluster).
#
# Quarkus reads /deployments/config/application.yaml at higher priority than the
# JAR. Merge these keys into your real ConfigMap (see docs/reference/configuration/cluster-overlay.md).
#
# OIDC: the bundled application.properties leaves quarkus.oidc.enabled unset (Quarkus default=true)
# but %dev/%test set it false. In-cluster config should still set it explicitly for operator clarity.
#
# Replace viewer-groups with JWT group names YOUR IdP puts on tokens.
# ------------------------------------------------------------------------------

quarkus:
  oidc:
    enabled: true

reson8:
  security:
    login-available: true
    endpoint-authorization-enabled: true
    dev-tier-cookie-enabled: false
    # Typical OpenShift OAuth: cluster admins (verify claim names from your IdP).
    admin-groups:
      - cluster-admins
    # Authenticated read-only UI + GET control/drop (no mutations).
    viewer-groups:
      - reson8-viewers
    # Tokenless listeners: sentinel token enables STREAM tier when listed here.
    stream-groups:
      - __anonymous__
