# shellcheck shell=bash
#
# Tracked defaults for deploy/run.sh.
# Copy to deploy/deploy.local.conf (gitignored) for workstation-specific overrides.

# Base runtime namespace name.
BASE_NS="reson8"

# Shared namespace that hosts the reson8-base BuildConfig/ImageStream.
SHARED_BUILDER_NS="${BASE_NS}-build"

# Module registry used by deploy/run.sh.
# Each module key follows MOD_<id>_<FIELD>.
MODULE_IDS=("reson8" "disson8")
LOCAL_DEV_MODULE_ID="reson8"

# Reson8 module (requires builder + configmap + CA checks).
MOD_reson8_PATH="reson8"
MOD_reson8_APP_NAME="reson8"
MOD_reson8_MANIFEST_DIR=".generated/quarkus"
MOD_reson8_NEEDS_BUILDER="1"
MOD_reson8_NEEDS_ROUTE_CHECK="1"
MOD_reson8_WAIT_FOR_ROLLOUT="1"
MOD_reson8_PRE_DEPLOY_CB="reson8_pre_deploy_callback"
MOD_reson8_POST_APPLY_CB="reson8_post_apply_callback"
MOD_reson8_OIDC_CLIENT_ID_FROM_SA="1"
MOD_reson8_DEPLOY_MODE="quarkus-deploy"

# Disson8 module (shared pipeline, no builder/configmap/CA callback needs).
MOD_disson8_PATH="disson8"
MOD_disson8_APP_NAME="disson8"
MOD_disson8_MANIFEST_DIR=".generated/quarkus"
MOD_disson8_NEEDS_BUILDER="0"
MOD_disson8_NEEDS_ROUTE_CHECK="1"
MOD_disson8_WAIT_FOR_ROLLOUT="1"
MOD_disson8_OIDC_CLIENT_ID_FROM_SA="0"
MOD_disson8_DEPLOY_MODE="quarkus-deploy"

# Deployment behavior toggles.
CA_WAIT_ATTEMPTS="${CA_WAIT_ATTEMPTS:-30}"
ROLLOUT_TIMEOUT="${ROLLOUT_TIMEOUT:-300s}"
AUTO_CREATE_DEV_NAMESPACE="${AUTO_CREATE_DEV_NAMESPACE:-1}"
FORCE_BASE_REBUILD="${FORCE_BASE_REBUILD:-0}"
SYNC_CONFIGMAP="${SYNC_CONFIGMAP:-1}"

# Base image source strategy:
#   auto    -> try cluster BuildConfig first, then local subscribed-host fallback
#   cluster -> cluster BuildConfig only
#   local   -> local subscribed-host build+push only
BASE_IMAGE_SOURCE="${BASE_IMAGE_SOURCE:-auto}"
ALLOW_LOCAL_BASE_FALLBACK="${ALLOW_LOCAL_BASE_FALLBACK:-1}"
LOCAL_BASE_IMAGE_TAG="${LOCAL_BASE_IMAGE_TAG:-localhost/reson8-base:local}"
BASE_IMAGE_TAG="${BASE_IMAGE_TAG:-reson8-base:latest}"

# Prod mode guard.
CONFIRM_PROD_DEPLOY="${CONFIRM_PROD_DEPLOY:-0}"
