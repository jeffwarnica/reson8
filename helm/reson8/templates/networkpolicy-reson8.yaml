{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "reson8.fullname" . }}
  labels:
    {{- include "reson8.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "reson8.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # Cluster DNS (OpenShift policy-group label)
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    # Kubernetes API (Service in default + apiserver namespace)
    {{- range .Values.networkPolicy.kubeApiNamespaces }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
    # Thanos querier (PromQL / readiness)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.thanosNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.thanosPort }}
    # OpenShift OAuth / authentication
    {{- range .Values.networkPolicy.oauthNamespaces }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    # OAuth issuer via public Route (*.apps.*) through the ingress router
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
