{{- if .Values.disson8.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reson8.fullname" . }}-disson8
  labels:
    {{- include "reson8.labels" . | nindent 4 }}
    app.kubernetes.io/name: disson8
    app.kubernetes.io/component: disson8
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: disson8
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: disson8
  template:
    metadata:
      labels:
        app.kubernetes.io/name: disson8
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: disson8
    spec:
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: disson8
          image: "{{ .Values.disson8.image.repository }}:{{ .Values.disson8.image.tag }}"
          imagePullPolicy: {{ .Values.disson8.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.disson8.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.disson8.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.disson8.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.disson8.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.disson8.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.disson8.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.disson8.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.disson8.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.disson8.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.disson8.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.disson8.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.disson8.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.disson8.probes.startup.failureThreshold }}
          {{- with .Values.disson8.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
