apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reson8.fullname" . }}
  labels:
    {{- include "reson8.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "reson8.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "reson8.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "reson8.serviceAccountName" . }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: reson8
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RESON8_AUDIO_PATH
              value: {{ .Values.config.reson8AudioPath | quote }}
            - name: OIDC_CLIENT_ID
              value: "system:serviceaccount:{{ .Release.Namespace }}:{{ include "reson8.serviceAccountName" . }}"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauthClientSecret.name }}
                  key: token
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          volumeMounts:
            - name: ca-trust-anchors
              mountPath: /etc/pki/ca-trust/source/anchors
              readOnly: true
            - name: app-config
              mountPath: {{ .Values.appConfig.mountPath }}
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: ca-trust-anchors
          projected:
            sources:
              - configMap:
                  name: openshift-service-ca.crt
                  items:
                    - key: service-ca.crt
                      path: service-ca.crt
              - configMap:
                  name: {{ .Values.trustedCaBundle.name }}
                  items:
                    - key: ca-bundle.crt
                      path: ingress-ca.crt
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: kube-ca.crt
        - name: app-config
          configMap:
            name: {{ .Values.appConfig.name }}
            optional: false
