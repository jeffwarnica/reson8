nameOverride: ""
fullnameOverride: ""

image:
  repository: quay.io/rhn_gps_jwarnica/reson8
  tag: v0.1.1
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

serviceAccount:
  create: true
  name: reson8
  oauthRedirectRouteName: ""

oauthClientSecret:
  create: true
  name: reson8-oauth-client-secret

service:
  type: ClusterIP
  port: 80
  targetPort: 8090

route:
  enabled: true
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# OpenShift NetworkPolicy baselines (default-deny + explicit allows).
# Requires a CNI that enforces NetworkPolicy (OpenShift SDN/OVN).
# Override namespaceSelectors if your cluster uses nonstandard labels.
networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    network.openshift.io/policy-group: ingress
  dnsNamespaceSelector:
    network.openshift.io/policy-group: dns
  kubeApiNamespaces:
    - default
    - openshift-kube-apiserver
  thanosNamespace: openshift-monitoring
  thanosPort: 9091
  oauthNamespaces:
    - openshift-authentication

disson8:
  enabled: true
  image:
    repository: quay.io/rhn_gps_jwarnica/disson8
    tag: v0.1.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  route:
    enabled: true
    host: ""
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  probes:
    liveness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 3
    startup:
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 30

config:
  reson8AudioPath: /opt/reson8

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
  startup:
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30

rbac:
  clusterScoped:
    create: true
    clusterRoleName: reson8-cluster-observer
    observerBindingName: reson8-cluster-observer
    monitoringBindingName: reson8-monitoring-view
    monitoringClusterRoleName: cluster-monitoring-view

trustedCaBundle:
  create: true
  name: reson8-trusted-ca-bundle
  injectLabel: config.openshift.io/inject-trusted-cabundle

appConfig:
  name: reson8-config
  mountPath: /deployments/config
  fileName: application.yaml
  # evaluator (default): readiness-check off, demo groups, DEBUG — concept validation.
  # production: use -f values-production.yaml (Thanos readiness on, explicit security, INFO).
  profile: evaluator
  # Set this to a YAML block to override the chart's bundled profile file entirely.
  inlineYaml: ""
