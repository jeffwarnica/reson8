nameOverride: ""
fullnameOverride: ""

image:
  repository: quay.io/rhn_gps_jwarnica/reson8
  tag: v0.1.0
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

serviceAccount:
  create: true
  name: reson8
  oauthRedirectRouteName: ""

oauthClientSecret:
  create: true
  name: reson8-oauth-client-secret

service:
  type: ClusterIP
  port: 80
  targetPort: 8090

route:
  enabled: true
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

config:
  reson8AudioPath: /opt/reson8

resources: {}

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
  startup:
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30

rbac:
  clusterScoped:
    create: true
    clusterRoleName: reson8-cluster-observer
    observerBindingName: reson8-cluster-observer
    monitoringBindingName: reson8-monitoring-view
    monitoringClusterRoleName: cluster-monitoring-view

trustedCaBundle:
  create: true
  name: reson8-trusted-ca-bundle
  injectLabel: config.openshift.io/inject-trusted-cabundle

appConfig:
  name: reson8-config
  mountPath: /deployments/config
  fileName: application.yaml
  # Set this to a YAML block to override the chart's default app config.
  inlineYaml: ""
