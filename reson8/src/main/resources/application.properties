quarkus.http.port=8090

# Behind OpenShift Route (TLS edge termination): honour Forwarded / X-Forwarded-* so OIDC redirect_uri and Location match the browser URL.
quarkus.http.proxy.proxy-address-forwarding=true

# SPA tier lists & behavior defaults live on Reson8Config.SecurityConfig; bundled application.yml supplies stream-groups etc.
# Cluster Route URLs / secrets never belong here — env or gitignored application-local.properties from application-local-DIST.properties.
# Dev / test overrides:
%dev.reson8.security.dev-tier-cookie-enabled=true
%test.reson8.security.dev-tier-cookie-enabled=true
%test.reson8.security.login-available=false
%test.reson8.security.endpoint-authorization-enabled=false

# quarkus.oidc.enabled is a BUILD-TIME property: the OIDC authentication mechanism is generated only when it is true
# during augmentation. We intentionally leave the unqualified key unset here (Quarkus default=true) so packaged builds
# keep OIDC wiring available, while %dev/%test force false for local and CI posture.
# Cluster runtime still sets quarkus.oidc.enabled=true explicitly in mounted application.yaml for clarity.
%dev.quarkus.oidc.enabled=false
%test.quarkus.oidc.enabled=false

#silent or gst
reson8dev.audiopath=gs

%test.reson8dev.audiopath=silent

%test.reson8.k8s.thanos.readiness-check=false

%dev.quarkus.log.category."com.coherentnetworksolutions".level=TRACE
%test.quarkus.log.category."com.coherentnetworksolutions".level=DEBUG
# OIDC / security: verbose only in dev & test — production defaults to root INFO (no extra keys in ConfigMaps).
%dev.quarkus.log.category."io.quarkus.oidc".level=DEBUG
%dev.quarkus.log.category."io.quarkus.security".level=DEBUG
%test.quarkus.log.category."io.quarkus.oidc".level=DEBUG
%test.quarkus.log.category."io.quarkus.security".level=DEBUG

%dev.quarkus.log.min-level=TRACE
%dev.quarkus.log.console.level=DEBUG
%test.quarkus.log.min-level=DEBUG
%test.quarkus.log.console.level=DEBUG
# OpenShift / prod: quiet console unless an operator raises levels in mounted config.
quarkus.log.min-level=INFO
quarkus.log.console.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
# Access log: dev/test only — production overhead is non-trivial under load.
# Enable in prod via cluster ConfigMap (quarkus.http.access-log.enabled: true) if needed.
%dev.quarkus.http.access-log.enabled=true
%test.quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern="%h %l %u %t \"%r\" %s %b \"%{i,Referer}\" \"%{i,User-Agent}\""

# reson8.source.mode=canned
# %test.reson8.source.mode=canned

# --- OpenShift deployment ---
quarkus.container-image.registry=image-registry.openshift-image-registry.svc:5000
quarkus.container-image.group=reson8
# OpenShift Dockerfile build (BuildConfig type "docker" — API name, not your host's container CLI).
# Default image pipeline stays in-cluster. Local Podman image build: Maven with
# -Dquarkus.container-image.builder=podman -Dquarkus.container-image.build=true (see Quarkus container-image guide).
quarkus.container-image.builder=openshift
quarkus.openshift.build-strategy=docker
quarkus.openshift.service-account=reson8
quarkus.openshift.replicas=1
quarkus.openshift.route.expose=true
# TLS edge termination: OpenShift router terminates HTTPS using its default wildcard cert.
# Pods receive plain HTTP; proxy-address-forwarding (above) passes the https scheme to Quarkus
# so OIDC redirect_uri, Location headers, and force-redirect-https-scheme all resolve correctly.
quarkus.openshift.route.tls.termination=edge
quarkus.openshift.route.tls.insecure-edge-termination-policy=Redirect
quarkus.openshift.env.vars.RESON8_AUDIO_PATH=/opt/reson8
# SA-as-OAuthClient: client_id is system:serviceaccount:<namespace>:<sa-name>.
# The SA token from reson8-oauth-client-secret is used as the client_secret.
# Both are namespace-scoped — no cluster-admin required.
quarkus.openshift.env.vars.OIDC_CLIENT_ID=system:serviceaccount:reson8:reson8
quarkus.openshift.env.mapping."OIDC_CLIENT_SECRET".from-secret=reson8-oauth-client-secret
quarkus.openshift.env.mapping."OIDC_CLIENT_SECRET".with-key=token
# OIDC discovery + bootstrap can take longer than the default startup probe window in some clusters.
# Give startup more headroom before kubelet restarts the container.
quarkus.openshift.startup-probe.initial-delay=PT20S
quarkus.openshift.startup-probe.period=PT10S
quarkus.openshift.startup-probe.failure-threshold=30

# Mount the application.yml ConfigMap at /deployments/config/ so Quarkus
# picks it up as a higher-priority config source than the bundled YAML.
# The ConfigMap must exist before deploying (see docs/flows/quarkus-openshift-deploy.md).
quarkus.openshift.config-map-volumes.app-config.config-map-name=reson8-config
quarkus.openshift.mounts.app-config.path=/deployments/config
quarkus.openshift.mounts.app-config.read-only=true
# CA trust anchors are projected into /etc/pki/ca-trust/source/anchors/ via the Deployment
# fragment in openshift.yml. The entrypoint (run-with-ca-update.sh) calls update-ca-trust
# before starting the JVM. No application-level cert config is needed or permitted.

# JaCoCo (Path A): quarkus-jacoco writes jacoco-quarkus.exec + HTML/XML report.
# XML at target/site/jacoco/jacoco.xml is the CI/IDE gutter artifact (Coverage Gutters default name).
# data-file default is target/jacoco-quarkus.exec — must match jacoco-maven-plugin destFile.
%dev.quarkus.jacoco.report=true
%test.quarkus.jacoco.report=true
quarkus.jacoco.report=true
quarkus.jacoco.report-location=target/site/jacoco

# --- Application info (/q/info) ---
# Stock quarkus-info JSON (build + git + java). Access is HTTP-policy only — not TierEndpointAuthorizationFilter.
# Packaged / cluster default: any authenticated caller. Local %dev/%test stay open (OIDC off).
quarkus.http.auth.permission.info.paths=/q/info
quarkus.http.auth.permission.info.policy=authenticated
quarkus.http.auth.permission.info.methods=GET
%dev.quarkus.http.auth.permission.info.policy=permit
%test.quarkus.http.auth.permission.info.policy=permit
quarkus.info.build.enabled=true
quarkus.info.git.enabled=true
quarkus.info.git.mode=standard
quarkus.info.java.enabled=true
quarkus.info.os.enabled=true